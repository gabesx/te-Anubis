version: 1

ai:
  # "auto" picks whichever provider API key is actually set (GEMINI_API_KEY, then
  # ANTHROPIC_API_KEY, then OPENAI_API_KEY) — set an explicit value here to pin one.
  provider: auto

review:
  minimum_confidence: 0.7
  max_comments: 15
  max_files: 50

skills:
  auto_detect: true
  enabled:
    - code-convention

github:
  inline_comments: true
  summary: true

fix:
  enabled: false
  auto_commit: false
  allowed:
    - SAFE
